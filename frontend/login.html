<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - UET Algorithm Battle</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { max-width: 420px; margin: 40px auto; padding: 28px; border: 1px solid #e2e8f0; border-radius: 12px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .auth-container h2 { text-align: center; color: #1e3a8a; margin-top: 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
        .form-group input { width: 100%; padding: 10px 12px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        .btn-auth { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; cursor: pointer; border-radius: 6px; font-size: 1rem; font-weight: bold; transition: background 0.2s; }
        .btn-auth:hover { background: #1d4ed8; }
        .switch-form { text-align: center; margin-top: 18px; cursor: pointer; color: #2563eb; font-weight: 500; }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html">⚔️ UET Algorithm Battle</a></h1>
        <nav>
            <a href="index.html">Trang Chủ</a>
            <a href="rules.html">📖 Luật Chơi</a>
            <a href="rooms.html">⚔️ Thi Đấu Thường</a>
            <a href="tournaments.html">🏆 Giải Đấu Knockout</a>
            <a href="ranking.html">📊 Bảng Xếp Hạng</a>
            <a href="login.html" class="active">Đăng Nhập</a>
        </nav>
    </header>
    
    <!-- Form Đăng Nhập -->
    <div class="auth-container" id="loginBox">
        <h2>Đăng Nhập</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Tên đăng nhập (Username)</label>
                <input type="text" id="l_user" required placeholder="Nhập username...">
            </div>
            <div class="form-group">
                <label>Mật khẩu (Password)</label>
                <input type="password" id="l_pass" required placeholder="Nhập mật khẩu...">
            </div>
            <button type="submit" class="btn-auth">Đăng Nhập</button>
        </form>
        <div class="switch-form" onclick="toggleForm()">Chưa có tài khoản? <strong>Đăng ký ngay</strong></div>
    </div>

    <!-- Form Đăng Ký -->
    <div class="auth-container" id="registerBox" style="display: none;">
        <h2>Tạo Tài Khoản Mới</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="r_email" required placeholder="name@vnu.edu.vn">
            </div>
            <div class="form-group">
                <label>Tên đăng nhập (Username)</label>
                <input type="text" id="r_user" required placeholder="Tên người chơi">
            </div>
            <div class="form-group">
                <label>Mật khẩu (Password)</label>
                <input type="password" id="r_pass" required placeholder="Tối thiểu 6 ký tự">
            </div>
            <button type="submit" class="btn-auth" style="background: #16a34a;">Đăng Ký Tài Khoản</button>
        </form>
        <div class="switch-form" onclick="toggleForm()">Đã có tài khoản? <strong>Quay lại đăng nhập</strong></div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
